# ===== Cyberpunk theme =====
# Colors

#Palette A – Classic Cyberpunk
#Neon Pink: #FF2A6D
#Neon Cyan: #05D9E8
#Neon Purple: #7B2CBF
#Acid Yellow: #F9F871
#Dark Asphalt: #0F172A


#Palette B – Dark Hacker
#Black: #020617
#Terminal Green: #00FF9C
#Electric Blue: #00B3FF
#Warning Red: #FF003C
#Muted Gray: #64748B


set $bg        #0F172A
set $fg        #E5E7EB
set $inactive  #1E293B
set $accent    #7B2CBF
set $accent2   #05D9E8


#                       border    background  text    indicator   child border
client.focused          $accent   $bg         $fg     $accent2    $accent
client.focused_inactive $inactive $inactive   $fg     $inactive   $inactive
client.unfocused        $inactive $inactive   $fg     $inactive   $inactive
client.urgent           #F9F871   #F9F871     #020617 #F9F871     #F9F871
