# ===== ASUKA Theme =====


# Colors
#Armor Red:    #C1121F
#Armor Orange: #FF6A00
#Dark Crimson: #5A0F14
#Warm Gray:    #B3A8A0
#Alert Yellow: #FFD000


set $bg        #120809
set $fg        #F5F5F5
set $inactive  #3A3A3A
set $accent    #C1121F
set $accent2   #FF6A00
set $alert     #FFD000

#                       border      bg         text    indicator  child border
client.focused          $accent     $bg        $fg     $accent2   $accent
client.focused_inactive $inactive   $inactive  $fg     $inactive  $inactive
client.unfocused        $inactive   $inactive  $fg     $inactive  $inactive
client.urgent           $alert      $alert     $bg     $alert     $alert
