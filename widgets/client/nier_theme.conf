# ===== NIER Theme =====

# Colors
#Machine Black:    #1C1B1A
#YoRHa Gold:       #C2B280
#YoRHa Beige:      #D6CBB8
#Silver White:     #DADBDD
#Soft Sepia:       #A89F8A
#Android Gray:     #5A5752
#Machine Red:      #A23B3B


set $bg        #1C1B1A
set $fg        #D6CBB8
set $inactive  #5A5752
set $accent    #C2B280
set $accent2   #A89F8A
set $alert     #A23B3B

#                       border      bg         text    indicator  child border
client.focused          $accent     $bg        $fg     $accent2   $accent
client.focused_inactive $inactive   $inactive  $fg     $inactive  $inactive
client.unfocused        $inactive   $inactive  $fg     $inactive  $inactive
client.urgent           $alert      $alert     $bg     $alert     $alert
