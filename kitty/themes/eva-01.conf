# ==============================
# EVA-01 (Purple / Neon Green) kitty terminal theme
# ==============================

# Terminal background
background #0d001a

# Text color
foreground #6AFF00

cursor #6AFF00
cursor_text_color #0d001a

selection_background #2a004f
selection_foreground #ffffff

# Black
color0  #0d001a
color8  #3a2a4d

# Red
color1  #ff005d
color9  #ff4d88

# Green (EVA glow)
color2  #39ff14
color10 #66ff66

# Yellow
color3  #ffe066
color11 #fff199

# Blue
color4  #6c77ff
color12 #8c92ff

# Magenta (primary)
color5  #b026ff
color13 #d066ff

# Cyan
color6  #00f5ff
color14 #66ffff

# White
color7  #e6e6e6
color15 #ffffff

# Window padding
window_padding_width 10
single_window_padding_width 12

active_border_color #7e9cd8
inactive_border_color #2a2a37

# Tabs and layout
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Terminal tab color
active_tab_foreground   #6AFF00
active_tab_background   #5B2D8B
inactive_tab_foreground #FF6A00
inactive_tab_background #0A0A0A
