# ==============================
# EVA-02 (Red / Orange) kitty terminal theme
# ==============================

# Terminal background
background #140000
# Text color
foreground #f2e6e6

cursor #ff3b30
cursor_text_color #140000

selection_background #3b0000
selection_foreground #ffffff

# Black
color0  #140000
color8  #402020

# Red (dominant)
color1  #ff3b30
color9  #ff6b60

# Green (minimal)
color2  #9ece6a
color10 #b9f27c

# Yellow / Orange
color3  #ff9f1c
color11 #ffb347

# Blue
color4  #5f87af
color12 #7aa2c2

# Magenta
color5  #ff5f87
color13 #ff87a5

# Cyan
color6  #5fd7d7
color14 #7fecec

# White
color7  #f2e6e6
color15 #ffffff

# Window padding
window_padding_width 10
single_window_padding_width 12

active_border_color #7e9cd8
inactive_border_color #2a2a37

# Tabs and layout
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Terminal tab color
active_tab_foreground   #5A0F14
active_tab_background   #FF6A00
inactive_tab_foreground #FF6A00
inactive_tab_background #5A0F14
