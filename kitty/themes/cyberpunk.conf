# ==============================
# Cyberpunk / Neon kitty terminal theme
# ==============================

# Terminal background
background #0a0014
# Text color
foreground #e6e1ff

cursor #05D9E8
cursor_text_color #0a0014

selection_background #1b0033
selection_foreground #ffffff

# Black
color0  #0a0014
color8  #3a2a5e

# Red (alerts)
color1  #ff005f
color9  #ff4f8a

# Green (neon)
color2  #00ff9c
color10 #4dffb3

# Yellow
color3  #ffe600
color11 #fff066

# Blue
color4  #6f7cff
color12 #8f9bff

# Magenta (primary neon)
color5  #d000ff
color13 #e066ff

# Cyan (secondary neon)
color6  #00fff0
color14 #66fff6

# White
color7  #e6e1ff
color15 #ffffff

# Window padding
window_padding_width 12
single_window_padding_width 14

active_border_color #d000ff
inactive_border_color #2a163f

cursor_shape block
cursor_blink_interval 0

# Tabs and layout
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Terminal tab color
active_tab_foreground   #1f1f28
active_tab_background   #7e9cd8
inactive_tab_foreground #c8c093
inactive_tab_background #16161d
